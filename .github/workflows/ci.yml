# Lint, type check, tests and build. See context/feature-specs/0.5-vitest-playwright-ci.md.
# The repository is public, so logs and uploaded reports are public: nothing may print connection
# details or personal data. No secrets are used.
name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push cancels an older run on development and on pull requests. Runs on main are never
# cancelled, so every push to main gets a complete result.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    # The build loads lib/db/client.ts, which needs DATABASE_URL to be set. Creating the client
    # opens no connection, and nothing connects to this placeholder.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      # Public Supabase values are inlined at build time. Nothing listens at this address, so auth
      # calls fail fast and the tests see the generic error. No real project is ever reached.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  db:
    name: Migrations and database tests
    runs-on: ubuntu-latest
    services:
      # Throwaway Postgres, matching Supabase's major version (17). It exists only for this run,
      # so its password is not a secret.
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-throwaway
          POSTGRES_DB: fintrack_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fintrack_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:ci-throwaway@localhost:5432/fintrack_ci
      DIRECT_URL: postgresql://postgres:ci-throwaway@localhost:5432/fintrack_ci
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx prisma migrate deploy
      - run: npx prisma migrate status
      - run: npm run test:db

  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    # The build loads lib/db/client.ts, which needs DATABASE_URL to be set. Creating the client
    # opens no connection, and nothing connects to this placeholder.
    env:
      DATABASE_URL: postgresql://placeholder:placeholder@localhost:5432/placeholder
      # Public Supabase values are inlined at build time. Nothing listens at this address, so auth
      # calls fail fast and the tests see the generic error. No real project is ever reached.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_placeholder
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # Also built in the checks job. Deliberate: the jobs run side by side (see the spec).
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
